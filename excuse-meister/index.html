<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excuse-Meister</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0f1a;
      color: #f0f0f5;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #f97316, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      margin-top: 0.5rem;
      color: #9ca3af;
      font-size: 1rem;
    }

    /* ── Main Card ── */
    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 1.25rem;
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 1.5rem;
    }

    /* ── Category Buttons ── */
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }

    /* Step indicators */
    .steps {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2d2d44;
      transition: background 0.3s;
    }
    .step-dot.active { background: #8b5cf6; }
    .step-dot.done   { background: #22c55e; }
    .step-line { flex: 1; height: 2px; background: #2d2d44; border-radius: 2px; }

    .categories {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .cat-btn {
      flex: 1;
      min-width: 90px;
      padding: 0.65rem 1rem;
      border-radius: 0.75rem;
      border: 2px solid #2d2d44;
      background: #121220;
      color: #9ca3af;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cat-btn:hover { border-color: #6b7280; color: #f0f0f5; }
    .cat-btn.active {
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
    }

    /* Scenario chips */
    .scenario-section {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
      margin-bottom: 0;
    }
    .scenario-section.visible {
      max-height: 300px;
      opacity: 1;
      margin-bottom: 1.5rem;
    }
    .scenario-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .chip {
      padding: 0.4rem 0.9rem;
      border-radius: 99px;
      border: 2px solid #2d2d44;
      background: #121220;
      color: #9ca3af;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .chip:hover { border-color: #ec4899; color: #f0f0f5; }
    .chip.active {
      border-color: #ec4899;
      background: rgba(236,72,153,0.15);
      color: #f9a8d4;
    }

    /* ── Generate Button ── */
    .generate-btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 0.85rem;
      border: none;
      background: linear-gradient(135deg, #f97316, #ec4899);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-bottom: 1.75rem;
    }
    .generate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .generate-btn:active { transform: translateY(0); }

    /* ── Excuse Output ── */
    .excuse-box {
      min-height: 80px;
      background: #12122a;
      border: 1px solid #2d2d44;
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 1.25rem;
      font-style: italic;
      transition: all 0.3s ease;
    }
    .excuse-box.empty { color: #4b5563; font-style: normal; font-size: 0.95rem; }

    /* ── Action Buttons Row ── */
    .action-row {
      display: flex;
      gap: 0.75rem;
    }

    .action-btn {
      flex: 1;
      padding: 0.65rem;
      border-radius: 0.75rem;
      border: 2px solid #2d2d44;
      background: #12122a;
      color: #9ca3af;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .action-btn:not(:disabled):hover { border-color: #6b7280; color: #f0f0f5; }
    .action-btn.copied { border-color: #22c55e; color: #4ade80; background: rgba(34,197,94,0.1); }
    .action-btn.upvoted { border-color: #f97316; color: #fb923c; background: rgba(249,115,22,0.1); }

    /* ── Strength Meter ── */
    .meter-card {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 1.25rem;
      padding: 1.5rem 2rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 1.5rem;
    }
    .meter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .meter-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6b7280; }
    .tier-label {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.2rem 0.65rem;
      border-radius: 99px;
      background: #12122a;
      color: #4b5563;
      transition: all 0.3s ease;
    }
    .tier-label.believable { background: rgba(34,197,94,0.15); color: #4ade80; }
    .tier-label.petty      { background: rgba(251,146,60,0.15); color: #fb923c; }
    .tier-label.ridiculous { background: rgba(239,68,68,0.15);  color: #f87171; }

    .meter-track {
      height: 12px;
      background: #12122a;
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid #2d2d44;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: #374151;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1), background 0.4s ease;
    }

    /* ── Leaderboard ── */
    .leaderboard-card {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 1.25rem;
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }
    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .leaderboard-header.open { border-bottom-color: #2d2d44; }
    .leaderboard-header h2 {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6b7280;
    }
    .toggle-icon {
      font-size: 0.85rem;
      color: #6b7280;
      transition: transform 0.3s ease;
    }
    .toggle-icon.open { transform: rotate(180deg); }

    .leaderboard-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }
    .leaderboard-body.open { max-height: 600px; }

    .leaderboard-list {
      list-style: none;
      padding: 1rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .leaderboard-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: #12122a;
      border: 1px solid #2d2d44;
      border-radius: 0.75rem;
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
    }
    .rank { font-size: 1.1rem; min-width: 1.5rem; text-align: center; }
    .excuse-text { flex: 1; color: #d1d5db; font-style: italic; line-height: 1.4; }
    .vote-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: #fb923c;
      background: rgba(249,115,22,0.1);
      border: 1px solid rgba(249,115,22,0.25);
      border-radius: 99px;
      padding: 0.15rem 0.55rem;
      white-space: nowrap;
    }
    .leaderboard-empty {
      text-align: center;
      color: #4b5563;
      padding: 1.5rem;
      font-size: 0.9rem;
    }

    /* ── Responsive ── */
    @media (max-width: 420px) {
      .card, .meter-card, .leaderboard-card { padding-left: 1.25rem; padding-right: 1.25rem; }
      .excuse-box { font-size: 1rem; }
      .chip { font-size: 0.8rem; padding: 0.35rem 0.7rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>😤 Excuse-Meister</h1>
    <p>The AI-powered generator of ridiculous, petty, and totally believable excuses.</p>
  </header>

  <!-- Generator Card -->
  <div class="card">

    <!-- Step indicators -->
    <div class="steps">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <!-- Step 1: Category -->
    <div class="section-label" id="stepLabel">Step 1 — Pick a category</div>
    <div class="categories">
      <button class="cat-btn" data-cat="work">💼 Work</button>
      <button class="cat-btn" data-cat="school">🎒 School</button>
      <button class="cat-btn" data-cat="social">🎉 Social</button>
    </div>

    <!-- Step 2: Scenario chips -->
    <div class="scenario-section" id="scenarioSection">
      <div class="section-label">Step 2 — Pick your scenario</div>
      <div class="scenario-chips" id="scenarioChips"></div>
    </div>

    <button class="generate-btn" id="generateBtn">⚡ Generate Excuse</button>

    <div class="excuse-box empty" id="excuseBox">
      Select a category and hit Generate — your petty excuse awaits.
    </div>

    <div class="action-row">
      <button class="action-btn" id="copyBtn" disabled>📋 Copy</button>
      <button class="action-btn" id="upvoteBtn" disabled>👍 Upvote</button>
    </div>
  </div>

  <!-- Strength Meter -->
  <div class="meter-card">
    <div class="meter-header">
      <span class="meter-title">💪 Excuse Strength Meter</span>
      <span class="tier-label" id="tierLabel">—</span>
    </div>
    <div class="meter-track">
      <div class="meter-fill" id="meterFill"></div>
    </div>
  </div>

  <!-- Leaderboard -->
  <div class="leaderboard-card">
    <div class="leaderboard-header" id="leaderboardToggle">
      <h2>🏆 Pettiest Excuses Leaderboard</h2>
      <span class="toggle-icon" id="toggleIcon">▼</span>
    </div>
    <div class="leaderboard-body" id="leaderboardBody">
      <ul class="leaderboard-list" id="leaderboardList"></ul>
    </div>
  </div>

  <script>
    // ── Scenario + Excuse Bank ───────────────────────────────────────────────
    const scenarios = {
      work: {
        "Late to work":        ["My alarm went off but it sounded so peaceful I assumed it was background music.", "I was late because my cat staged a protest against Mondays.", "The traffic was emotional, not physical — my feelings were backed up for miles.", "I left on time but my body disagreed and staged a sit-in."],
        "Skipping a meeting":  ["My WiFi router needed an emotional support break and I couldn't abandon it.", "My coffee took 45 minutes to emotionally prepare me for that meeting.", "I had a scheduling conflict between the meeting and my existential crisis.", "My calendar said 'optional' and I interpreted that very literally."],
        "Missing a deadline":  ["My keyboard kept autocorrecting 'deadline' to 'dead line' and I took it as a warning.", "I submitted it mentally — the upload just hasn't synced yet.", "I misread the deadline as a suggestion.", "My creative flow was on do-not-disturb."],
        "Not replying":        ["My inbox has a mandatory 48-hour cooling-off period.", "I read it, had thoughts, and then the thoughts got complicated.", "I drafted a reply — my drafts folder is just very possessive.", "I didn't want to reply too fast and seem eager."],
        "Leaving early":       ["The fire alarm in my head went off.", "My out-of-office is on — mentally, I mean.", "My body submitted a formal resignation from the rest of the day.", "I was being proactive about tomorrow's productivity."]
      },
      school: {
        "Late to class":       ["I was late because I took the scenic route through my own hallway.", "My bus was on time so I assumed it was the wrong bus.", "I got there early but waited outside for the right vibes.", "My internal clock runs on a different time zone."],
        "Forgot homework":     ["My dog didn't eat it — he gave detailed feedback and I had to revise.", "I forgot my homework because the assignment gave me too much to think about.", "I completed it spiritually — the physical copy is still buffering.", "The Wi-Fi went out exactly when I was about to print it."],
        "Failed a test":       ["My calculator had an existential crisis right before the test.", "I studied so hard I accidentally erased the information.", "The questions were ambiguous — I answered a different, better version of them.", "My pen ran out of confidence halfway through."],
        "Skipping class":      ["I attended in spirit — my body had a prior commitment.", "I couldn't concentrate — the silence in the library was too loud.", "I was doing independent research (sleeping).", "My notes from last time were so good I didn't feel I needed a sequel."],
        "No pen/supplies":     ["My pencil broke and I took it as a sign to reschedule.", "I had the notes — they just disagreed with me.", "My highlighter ran out mid-sentence and I lost all motivation.", "I lent my pen to someone last week and the emotional wound hasn't healed."]
      },
      social: {
        "Running late":        ["I'm not late — you all started too early.", "My Uber driver took a detour through three stages of grief.", "I got stuck in traffic. Inside my apartment. Emotional traffic.", "I left on time but took a wrong turn on the way out of my own house."],
        "Cancelling plans":    ["I was going to come but my couch made a compelling counterargument.", "I RSVPed yes in a moment of optimism I no longer relate to.", "I got ready and then reconsidered the concept of socialising entirely.", "Something came up — specifically, the urge to not go."],
        "Not texting back":    ["I was going to text back, but I didn't want to seem too available.", "My phone died and I lost the will to charge it.", "I saw it, panicked, and waited for the panic to pass. Still waiting.", "I typed and deleted a reply 7 times. The 8th one is still in development."],
        "Leaving a date early":["I couldn't find parking for my feelings, so I went home.", "I was on my way but my blanket filed an injunction.", "An urgent prior commitment came up: my bed.", "I had a wonderful time but my social battery filed for bankruptcy."],
        "Dodging an event":    ["I was in the area but my anxiety wasn't.", "I was going to come but logistically my comfort zone is non-negotiable.", "I had every intention of attending until I didn't.", "I showed up emotionally — that should count for something."]
      }
    };

    const RANKS = ['🥇','🥈','🥉','4️⃣','5️⃣'];
    const STORAGE_KEY = 'excuseMeisterVotes';

    // ── State ────────────────────────────────────────────────────────────────
    let selectedCategory = null;
    let selectedScenario = null;
    let currentExcuse    = null;
    let lastExcuse       = null;
    let votes            = loadVotes();

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const excuseBox        = document.getElementById('excuseBox');
    const generateBtn      = document.getElementById('generateBtn');
    const copyBtn          = document.getElementById('copyBtn');
    const upvoteBtn        = document.getElementById('upvoteBtn');
    const meterFill        = document.getElementById('meterFill');
    const tierLabel        = document.getElementById('tierLabel');
    const leaderboardBody  = document.getElementById('leaderboardBody');
    const leaderboardList  = document.getElementById('leaderboardList');
    const leaderboardToggle= document.getElementById('leaderboardToggle');
    const toggleIcon       = document.getElementById('toggleIcon');
    const scenarioSection  = document.getElementById('scenarioSection');
    const scenarioChips    = document.getElementById('scenarioChips');
    const stepLabel        = document.getElementById('stepLabel');
    const dot1 = document.getElementById('dot1');
    const dot2 = document.getElementById('dot2');
    const dot3 = document.getElementById('dot3');

    // ── Category selection ───────────────────────────────────────────────────
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCategory = btn.dataset.cat;
        selectedScenario = null;

        // populate scenario chips
        scenarioChips.innerHTML = Object.keys(scenarios[selectedCategory]).map(s =>
          `<button class="chip" data-scenario="${escapeHtml(s)}">${s}</button>`
        ).join('');

        scenarioSection.classList.add('visible');
        stepLabel.textContent = 'Step 1 — Category selected ✓';

        // update step dots
        dot1.classList.add('done'); dot1.classList.remove('active');
        dot2.classList.add('active'); dot2.classList.remove('done');
        dot3.classList.remove('active','done');

        // bind chip clicks
        scenarioChips.querySelectorAll('.chip').forEach(chip => {
          chip.addEventListener('click', () => {
            scenarioChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            selectedScenario = chip.dataset.scenario;

            dot2.classList.add('done'); dot2.classList.remove('active');
            dot3.classList.add('active'); dot3.classList.remove('done');
            stepLabel.textContent = `Step 2 — "${selectedScenario}" selected ✓`;
          });
        });
      });
    });

    // ── Generate ─────────────────────────────────────────────────────────────
    generateBtn.addEventListener('click', generateExcuse);

    function generateExcuse() {
      if (!selectedCategory) {
        excuseBox.textContent = '👆 Pick a category first!';
        excuseBox.classList.add('empty');
        return;
      }
      if (!selectedScenario) {
        excuseBox.textContent = '👆 Now pick a scenario!';
        excuseBox.classList.add('empty');
        return;
      }

      const pool = scenarios[selectedCategory][selectedScenario];
      let pick;
      do { pick = pool[Math.floor(Math.random() * pool.length)]; }
      while (pick === lastExcuse && pool.length > 1);

      lastExcuse    = pick;
      currentExcuse = pick;

      excuseBox.textContent = `"${pick}"`;
      excuseBox.classList.remove('empty');

      // mark step 3 done
      dot3.classList.add('done'); dot3.classList.remove('active');
      stepLabel.textContent = `✅ Excuse generated for: ${selectedScenario}`;

      updateMeter(Math.floor(Math.random() * 100) + 1);

      copyBtn.disabled   = false;
      upvoteBtn.disabled = false;
      upvoteBtn.textContent = '👍 Upvote';
      upvoteBtn.classList.remove('upvoted');
    }

    // ── Strength Meter ───────────────────────────────────────────────────────
    function updateMeter(score) {
      meterFill.style.width = score + '%';

      tierLabel.classList.remove('believable','petty','ridiculous');

      if (score <= 33) {
        meterFill.style.background = '#22c55e';
        tierLabel.textContent = '😇 Believable';
        tierLabel.classList.add('believable');
      } else if (score <= 66) {
        meterFill.style.background = '#f97316';
        tierLabel.textContent = '😏 Petty';
        tierLabel.classList.add('petty');
      } else {
        meterFill.style.background = '#ef4444';
        tierLabel.textContent = '🤡 Ridiculous';
        tierLabel.classList.add('ridiculous');
      }
    }

    // ── Copy to Clipboard ────────────────────────────────────────────────────
    copyBtn.addEventListener('click', () => {
      if (!currentExcuse) return;
      navigator.clipboard.writeText(currentExcuse).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = currentExcuse;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      });
      copyBtn.textContent = '✅ Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '📋 Copy';
        copyBtn.classList.remove('copied');
      }, 1500);
    });

    // ── Upvote ───────────────────────────────────────────────────────────────
    upvoteBtn.addEventListener('click', upvoteExcuse);

    function upvoteExcuse() {
      if (!currentExcuse) return;
      votes[currentExcuse] = (votes[currentExcuse] || 0) + 1;
      saveVotes();
      renderLeaderboard();

      upvoteBtn.textContent = `👍 ${votes[currentExcuse]} vote${votes[currentExcuse] !== 1 ? 's' : ''}`;
      upvoteBtn.classList.add('upvoted');
    }

    // ── Leaderboard ──────────────────────────────────────────────────────────
    leaderboardToggle.addEventListener('click', () => {
      const open = leaderboardBody.classList.toggle('open');
      leaderboardToggle.classList.toggle('open', open);
      toggleIcon.classList.toggle('open', open);
    });

    function renderLeaderboard() {
      const sorted = Object.entries(votes)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      if (sorted.length === 0) {
        leaderboardList.innerHTML = '<li class="leaderboard-empty">No votes yet — generate and upvote some excuses!</li>';
        return;
      }

      leaderboardList.innerHTML = sorted.map(([text, count], i) => `
        <li class="leaderboard-item">
          <span class="rank">${RANKS[i]}</span>
          <span class="excuse-text">${escapeHtml(text)}</span>
          <span class="vote-badge">${count} 👍</span>
        </li>
      `).join('');
    }

    // ── localStorage helpers ─────────────────────────────────────────────────
    function loadVotes() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }

    function saveVotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    renderLeaderboard();
  </script>
</body>
</html>
